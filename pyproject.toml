[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-mastery"
version = "0.5.0"
description = "树莓派本地自动化的中文实验代码与笔记"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "zwuyang9-commits"},
]
keywords = ["raspberry-pi", "gpio", "offline-first", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zwuyang9-commits/raspberry-pi-mastery-cn"
Repository = "https://github.com/zwuyang9-commits/raspberry-pi-mastery-cn"
Issues = "https://github.com/zwuyang9-commits/raspberry-pi-mastery-cn/issues"

[project.optional-dependencies]
pi = [
    "gpiozero>=2.0",
    "adafruit-circuitpython-dht>=4.0",
    "adafruit-circuitpython-bme280>=2.6",
]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
vision = ["opencv-python-headless>=4.10,<5"]
dev = [
    "build>=1.2",
    "fastapi>=0.115",
    "httpx2>=2.0,<3",
    "pytest>=8.0",
    "pytest-cov>=7,<8",
    "ruff>=0.6",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=rpi_mastery --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["rpi_mastery"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
