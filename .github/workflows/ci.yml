name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python scripts/preflight.py --json
      - run: python scripts/run_api.py --check

  package:
    name: Build and install package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_release.py
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/artifact_manifest.py generate --commit "${GITHUB_SHA}"
      - run: python scripts/artifact_manifest.py verify --commit "${GITHUB_SHA}"
      - run: python -m venv .wheel-test
      - run: .wheel-test/bin/python -m pip install --no-deps dist/*.whl
      - run: .wheel-test/bin/python -m pip check
      - name: Verify wheel metadata and public API
        run: >-
          .wheel-test/bin/python -c
          "from importlib.metadata import version; import rpi_mastery;
          assert version('rpi-mastery') == rpi_mastery.__version__;
          assert rpi_mastery.QueueStatus.__name__ == 'QueueStatus'"
      - run: python -m venv .sdist-test
      - run: .sdist-test/bin/python -m pip install --no-deps dist/*.tar.gz
      - run: .sdist-test/bin/python -m pip check
      - name: Verify sdist metadata and public API
        run: >-
          .sdist-test/bin/python -c
          "from importlib.metadata import version; import rpi_mastery;
          assert version('rpi-mastery') == rpi_mastery.__version__;
          assert rpi_mastery.QueueStatus.__name__ == 'QueueStatus'"
      - uses: actions/upload-artifact@v7
        with:
          name: rpi-mastery-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  service-smoke:
    name: Start API and check health
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[web]"
      - run: python scripts/smoke_api.py

  dependency-audit:
    name: Audit dependencies and create SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev,web]"
      - run: python -m pip install "pip-audit>=2.10,<3"
      - run: >-
          python -m pip_audit --local --skip-editable
          --format cyclonedx-json --output dependency-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-sbom-${{ github.sha }}
          path: dependency-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14
